{% extends "base.html" %}

{% block content %}

<h2>Hero Creation Page</h2>

<form method="POST">
    <input 
    type = "text"
    name = "hero_name"
    placeholder = "Enter hero name">

    <button>Create Hero</button>
</form>

{% if hero_name %}
    <h2>Hero Created: </h2>
    <p>{{ hero_name }}</p>
{% endif %}

{% endblock %}
