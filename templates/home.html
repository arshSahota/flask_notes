<!DOCTYPE html>
<html>
<body>

    <h1>Hero Title Generator</h1>

    <form method="POST">
        <input
            type="text"
            name="hero_name"
            placeholder="Enter name here"
            required
        >

        <button type="submit">Generate Title</button>
    </form>

    {% if hero_name == "Arshdeep" %}
        <h2>Legendary Hero Arshdeep</h2>
    {% elif hero_name %}
        <h2>Welcome Hero {{ hero_name }}</h2>
    {% endif %}

</body>
</html>
